<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECC Voting — BTP Prototype</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #181b22;
        --fg: #e6e8ee;
        --muted: #8a93a6;
        --accent: #6ea8ff;
        --border: #262a35;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .container { max-width: 820px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin: 0 0 4px; }
      h2 { margin-top: 0; }
      .subtitle { color: var(--muted); margin-bottom: 24px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 18px;
      }
      .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
      .tab {
        background: var(--card); color: var(--fg);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 14px; cursor: pointer;
      }
      .tab.active { border-color: var(--accent); color: var(--accent); }
      button {
        background: var(--accent); color: #001b3d; border: 0;
        padding: 9px 16px; border-radius: 7px; cursor: pointer;
        font-weight: 600;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input, select {
        background: #0f1219; color: var(--fg);
        border: 1px solid var(--border); border-radius: 7px;
        padding: 9px 11px; width: 100%; font-family: inherit;
      }
      label { display:block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
      code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
      pre {
        background: #0b0d12; padding: 12px; border-radius: 7px;
        overflow-x: auto; border: 1px solid var(--border);
        word-break: break-all; white-space: pre-wrap;
      }
      .ok  { color: #6fe08a; }
      .err { color: #ff7a7a; }
      .row { display: flex; gap: 10px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
